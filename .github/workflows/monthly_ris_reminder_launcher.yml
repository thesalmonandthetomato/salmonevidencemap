name: Monthly manual RIS reminder launcher

on:
  schedule:
    # 09:00 Europe/London: 08:00 UTC in BST, 09:00 UTC in GMT.
    - cron: '0 8,9 17 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch-reminder:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check UK local reminder time
        id: due
        env:
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime, os
          from zoneinfo import ZoneInfo
          uk = datetime.datetime.now(ZoneInfo("Europe/London"))
          due = (uk.day == 17 and uk.hour == 9)
          if os.environ["EVENT_NAME"] == "workflow_dispatch":
              due = True
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"due={'true' if due else 'false'}\n")
          print(f"UK local time {uk.isoformat()}, due={due}")
          PY

      - name: Trigger private reminder by updating a branch-specific file
        if: steps.due.outputs.due == 'true'
        env:
          GH_TOKEN: ${{ secrets.LIVING_EVIDENCE_MAP_DISPATCH_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::LIVING_EVIDENCE_MAP_DISPATCH_PAT is missing in salmonevidencemap."
            exit 1
          fi
          repo="thesalmonandthetomato/LivingEvidenceMap"
          path="user_input/monthly_ris_reminder_trigger.txt"
          ref="workflow01-final-architecture"
          timestamp="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          content="$(printf 'Monthly manual RIS reminder trigger: %s\n' "$timestamp" | base64 -w0)"
          existing_sha="$(gh api "repos/$repo/contents/$path?ref=$ref" --jq '.sha' 2>/dev/null || true)"
          if [ -n "$existing_sha" ]; then
            gh api --method PUT "repos/$repo/contents/$path" \
              -f message="Trigger monthly CAB and PQD&T reminder" \
              -f branch="$ref" \
              -f content="$content" \
              -f sha="$existing_sha" >/dev/null
          else
            gh api --method PUT "repos/$repo/contents/$path" \
              -f message="Trigger monthly CAB and PQD&T reminder" \
              -f branch="$ref" \
              -f content="$content" >/dev/null
          fi
          echo "PASS: reminder trigger pushed to private production branch"
