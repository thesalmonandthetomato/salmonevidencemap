name: Publish salmon evidence map

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'dashboard-data.js'
      - 'methodology.html'
      - 'results.html'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Prepare Pages bundle
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s dashboard-data.js
          test -s methodology.html
          test -s results.html
          test "$(wc -c < dashboard-data.js)" -gt 40000000
          grep -q './dashboard-data.js' index.html
          grep -q './methodology.html' index.html
          grep -q './results.html' index.html
          mkdir -p /tmp/site
          cp index.html dashboard-data.js methodology.html results.html .nojekyll /tmp/site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
